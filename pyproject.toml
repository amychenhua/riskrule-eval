[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskrule-eval"
version = "0.1.0"
description = "银行风控规则策略的收益与风险量化评估：反洗钱、反电诈、贷前反欺诈、贷前审批、贷中调额、贷后预警"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["risk", "credit", "fraud", "aml", "rules", "cost-benefit", "风控", "规则策略"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
riskrule = "riskrule_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskrule_eval = ["scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
